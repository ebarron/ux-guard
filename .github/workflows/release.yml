name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example, 0.6.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: "@edjbarron/ux-guard"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Verify the bundled OIDC-capable npm CLI
        run: test "$(npm --version)" = "11.12.1"

      - name: Fail closed unless this is verified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.ref == 'refs/heads/main' }}" = "true"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_NAME" = "$EXPECTED_PACKAGE"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"
          node - "$RELEASE_VERSION" <<'NODE'
          const { readFileSync } = require('node:fs');
          const version = process.argv[2];
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## [${version}]`)) {
            throw new Error(`CHANGELOG.md has no ${version} release`);
          }
          NODE
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.verification.verified)" = "true"
          test -z "$(git status --porcelain)"

      - name: Fail if the version, tag, or release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag already exists: $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release already exists: $TAG"
            exit 1
          fi
          set +e
          NPM_VIEW="$(npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" version --json 2>&1)"
          NPM_VIEW_STATUS=$?
          set -e
          if test "$NPM_VIEW_STATUS" -eq 0; then
            echo "::error::package version already exists: $EXPECTED_PACKAGE@$RELEASE_VERSION"
            exit 1
          fi
          if [[ "$NPM_VIEW" != *"E404"* ]]; then
            echo "::error::npm registry preflight failed without an E404"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run check:hygiene
      - run: npm run check:test-catalog
      - run: npm run check:package
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run test:install

  publish:
    name: Publish npm and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Verify the bundled OIDC-capable npm CLI
        run: test "$(npm --version)" = "11.12.1"

      - name: Revalidate release identity and availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.ref == 'refs/heads/main' }}" = "true"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./package.json').name")" = "$EXPECTED_PACKAGE"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.verification.verified)" = "true"
          TAG="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag already exists: $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release already exists: $TAG"
            exit 1
          fi
          set +e
          NPM_VIEW="$(npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" version --json 2>&1)"
          NPM_VIEW_STATUS=$?
          set -e
          if test "$NPM_VIEW_STATUS" -eq 0; then
            echo "::error::package version already exists: $EXPECTED_PACKAGE@$RELEASE_VERSION"
            exit 1
          fi
          if [[ "$NPM_VIEW" != *"E404"* ]]; then
            echo "::error::npm registry preflight failed without an E404"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - run: npm ci --ignore-scripts
      - run: npm run check:hygiene
      - run: npm run check:test-catalog
      - run: npm run check:package
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run test:install

      - name: Build and inspect the exact release tarball
        id: package
        run: |
          set -euo pipefail
          mkdir dist
          npm pack --json --ignore-scripts --pack-destination dist > dist/npm-pack.json
          TARBALL_NAME="$(node -e "const p=require('./dist/npm-pack.json')[0]; process.stdout.write(p.filename)")"
          EXPECTED_TARBALL="edjbarron-ux-guard-$RELEASE_VERSION.tgz"
          test "$TARBALL_NAME" = "$EXPECTED_TARBALL"
          TARBALL="./dist/$TARBALL_NAME"
          EXPECTED_INTEGRITY="$(node -e "const p=require('./dist/npm-pack.json')[0]; process.stdout.write(p.integrity)")"
          npm run test:install -- "$TARBALL"
          npm sbom --sbom-format cyclonedx --omit=dev > "dist/ux-guard-$RELEASE_VERSION.sbom.cdx.json"
          node - "$RELEASE_VERSION" <<'NODE'
          const { readFileSync } = require('node:fs');
          const version = process.argv[2];
          const sbom = JSON.parse(readFileSync(`dist/ux-guard-${version}.sbom.cdx.json`, 'utf8'));
          if (sbom.bomFormat !== 'CycloneDX') throw new Error('unexpected SBOM format');
          const packed = JSON.parse(readFileSync('dist/npm-pack.json', 'utf8'))[0];
          for (const path of [
            'README.md',
            'docs/cli-reference.md',
            'skills/ux-guard/SKILL.md',
          ]) {
            if (!packed.files.some((file) => file.path === path)) {
              throw new Error(`release tarball is missing ${path}`);
            }
          }
          NODE
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$EXPECTED_INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/ux-guard-$RELEASE_VERSION.sbom.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest release tarball provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tarball }}

      - name: Preserve provenance attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/ux-guard-$RELEASE_VERSION.provenance.sigstore.json"

      - name: Attest release tarball SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tarball }}
          sbom-path: ${{ steps.package.outputs.sbom }}

      - name: Preserve SBOM attestation bundle and checksums
        env:
          BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "dist/ux-guard-$RELEASE_VERSION.sbom.sigstore.json"
          (
            cd dist
            sha256sum \
              "edjbarron-ux-guard-$RELEASE_VERSION.tgz" \
              npm-pack.json \
              "ux-guard-$RELEASE_VERSION.provenance.sigstore.json" \
              "ux-guard-$RELEASE_VERSION.sbom.cdx.json" \
              "ux-guard-$RELEASE_VERSION.sbom.sigstore.json" \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Recheck immutability boundaries before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          TAG="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag already exists: $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release already exists: $TAG"
            exit 1
          fi
          set +e
          NPM_VIEW="$(npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" version --json 2>&1)"
          NPM_VIEW_STATUS=$?
          set -e
          if test "$NPM_VIEW_STATUS" -eq 0; then
            echo "::error::package version already exists: $EXPECTED_PACKAGE@$RELEASE_VERSION"
            exit 1
          fi
          if [[ "$NPM_VIEW" != *"E404"* ]]; then
            echo "::error::npm registry preflight failed without an E404"
            exit 1
          fi

      - name: Create draft release with immutable assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          # ux-guard $RELEASE_VERSION

          Install from npm:

          \`npm install --save-dev $EXPECTED_PACKAGE@$RELEASE_VERSION\`

          Start with:

          \`npx ux-guard setup\`

          The attached npm tarball is the exact artifact published to npm. Verify
          \`SHA256SUMS\`, the CycloneDX SBOM, and the GitHub/Sigstore attestations
          before use.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$TAG" \
            --notes-file "$NOTES" \
            "dist/edjbarron-ux-guard-$RELEASE_VERSION.tgz" \
            dist/npm-pack.json \
            "dist/ux-guard-$RELEASE_VERSION.provenance.sigstore.json" \
            "dist/ux-guard-$RELEASE_VERSION.sbom.cdx.json" \
            "dist/ux-guard-$RELEASE_VERSION.sbom.sigstore.json" \
            dist/SHA256SUMS

      - name: Publish exact tarball to npm with OIDC provenance
        id: publish
        continue-on-error: true
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish "$TARBALL" --provenance --access public

      - name: Confirm npm accepted the exact tarball
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          ACTUAL_INTEGRITY=""
          for attempt in {1..12}; do
            set +e
            ACTUAL_INTEGRITY="$(npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" dist.integrity 2>/dev/null)"
            STATUS=$?
            set -e
            if test "$STATUS" -eq 0 && test -n "$ACTUAL_INTEGRITY"; then
              break
            fi
            sleep 5
          done
          if test "$ACTUAL_INTEGRITY" != "$EXPECTED_INTEGRITY"; then
            echo "::error::npm did not expose the exact release tarball (publish outcome: $PUBLISH_OUTCOME)"
            gh release delete "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            exit 1
          fi

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          set +e
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          EDIT_STATUS=$?
          set -e
          if test "$EDIT_STATUS" -ne 0; then
            gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$TAG" "$TARBALL" --repo "$GITHUB_REPOSITORY"
