# TEMPORARY: remove this workflow immediately after the v0.6.0 bootstrap.
# The permanent release.yml workflow must remain OIDC-only.
name: Bootstrap @edjbarron/ux-guard 0.6.0 (temporary)

on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact package and version authorized for this bootstrap
        required: true
        type: choice
        options:
          - "@edjbarron/ux-guard@0.6.0"
      commit:
        description: Exact protected main commit to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-edjbarron-ux-guard-0.6.0
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: "@edjbarron/ux-guard"
  EXPECTED_SPEC: "@edjbarron/ux-guard@0.6.0"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  RELEASE_TAG: "v0.6.0"
  RELEASE_VERSION: "0.6.0"
  REQUESTED_COMMIT: ${{ inputs.commit }}
  REQUESTED_PACKAGE: ${{ inputs.package }}

jobs:
  verify:
    name: Verify one-time bootstrap candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Verify the bundled provenance-capable npm CLI
        run: test "$(npm --version)" = "11.12.1"

      - name: Fail closed unless this is the exact protected main state
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          test "$REQUESTED_PACKAGE" = "$EXPECTED_SPEC"
          [[ "$REQUESTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.verification.verified)" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = "true"
          test "$(node -p "require('./package.json').name")" = "$EXPECTED_PACKAGE"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          node - "$RELEASE_VERSION" <<'NODE'
          const { readFileSync } = require('node:fs');
          const version = process.argv[2];
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## [${version}]`)) {
            throw new Error(`CHANGELOG.md has no ${version} release`);
          }
          NODE
          test -z "$(git status --porcelain)"

      - run: npm ci --ignore-scripts
      - run: npm run check:hygiene
      - run: npm run check:test-catalog
      - run: npm run check:package
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run test:install

      - name: Verify absence or an exact recoverable partial release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verify-dist
          npm pack --json --ignore-scripts --pack-destination verify-dist > verify-dist/npm-pack.json
          EXPECTED_INTEGRITY="$(node -e "const p=require('./verify-dist/npm-pack.json')[0]; process.stdout.write(p.integrity)")"

          TAG_PRESENT=false
          TAG_SHA=""
          set +e
          TAG_LINE="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG^{}" 2>/dev/null)"
          TAG_STATUS=$?
          if test "$TAG_STATUS" -eq 2; then
            TAG_LINE="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" 2>/dev/null)"
            TAG_STATUS=$?
          fi
          set -e
          if test "$TAG_STATUS" -eq 0; then
            TAG_PRESENT=true
            TAG_SHA="${TAG_LINE%%[[:space:]]*}"
          elif test "$TAG_STATUS" -ne 2; then
            echo "::error::unable to determine remote tag state"
            exit 1
          fi

          RELEASE_PRESENT=false
          RELEASE_DRAFT=false
          RELEASE_TARGET=""
          RELEASE_MATCHES="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName \
            --jq '.[] | select(.tagName == "v0.6.0") | .tagName')"
          if test "$RELEASE_MATCHES" = "$RELEASE_TAG"; then
            RELEASE_PRESENT=true
            RELEASE_DRAFT="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)"
            RELEASE_TARGET="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish \
              --jq .targetCommitish)"
          elif test -n "$RELEASE_MATCHES"; then
            echo "::error::ambiguous GitHub release state"
            exit 1
          fi

          set +e
          NPM_VIEW="$(npm view "$EXPECTED_SPEC" dist.integrity 2>&1)"
          NPM_STATUS=$?
          set -e
          if test "$NPM_STATUS" -eq 0; then
            test "$NPM_VIEW" = "$EXPECTED_INTEGRITY" || {
              echo "::error::npm has this version with different integrity"
              exit 1
            }
            if test "$RELEASE_PRESENT" = "true" && test "$RELEASE_DRAFT" != "true"; then
              echo "::error::the immutable GitHub release already exists"
              exit 1
            fi
            if test "$TAG_PRESENT" = "true" && test "$TAG_SHA" != "$GITHUB_SHA"; then
              echo "::error::the existing tag does not identify the requested commit"
              exit 1
            fi
            if test "$RELEASE_PRESENT" = "true" && test "$RELEASE_TARGET" != "$GITHUB_SHA"; then
              echo "::error::the draft release does not target the requested commit"
              exit 1
            fi
            echo "Exact npm integrity is recoverable; only a missing GitHub release may be completed."
          else
            [[ "$NPM_VIEW" == *"E404"* ]] || {
              echo "::error::npm registry preflight failed without an E404"
              exit 1
            }
            if test "$TAG_PRESENT" = "true" || test "$RELEASE_PRESENT" = "true"; then
              echo "::error::a tag or release exists before npm publication"
              exit 1
            fi
            echo "Package, tag, and release are absent."
          fi

  publish:
    name: Publish one-time bootstrap
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Verify the bundled provenance-capable npm CLI
        run: test "$(npm --version)" = "11.12.1"

      - name: Revalidate exact protected main state
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          test "$REQUESTED_PACKAGE" = "$EXPECTED_SPEC"
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.verification.verified)" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = "true"
          test "$(node -p "require('./package.json').name")" = "$EXPECTED_PACKAGE"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test -z "$(git status --porcelain)"

      - run: npm ci --ignore-scripts
      - run: npm run check:hygiene
      - run: npm run check:test-catalog
      - run: npm run check:package
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run test:install

      - name: Build and inspect the exact release tarball
        id: package
        run: |
          set -euo pipefail
          mkdir dist
          npm pack --json --ignore-scripts --pack-destination dist > dist/npm-pack.json
          TARBALL_NAME="$(node -e "const p=require('./dist/npm-pack.json')[0]; process.stdout.write(p.filename)")"
          test "$TARBALL_NAME" = "edjbarron-ux-guard-0.6.0.tgz"
          TARBALL="dist/$TARBALL_NAME"
          EXPECTED_INTEGRITY="$(node -e "const p=require('./dist/npm-pack.json')[0]; process.stdout.write(p.integrity)")"
          npm run test:install -- "$TARBALL"
          npm sbom --sbom-format cyclonedx --omit=dev > "dist/ux-guard-0.6.0.sbom.cdx.json"
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const sbom = JSON.parse(readFileSync('dist/ux-guard-0.6.0.sbom.cdx.json', 'utf8'));
          if (sbom.bomFormat !== 'CycloneDX') throw new Error('unexpected SBOM format');
          const packed = JSON.parse(readFileSync('dist/npm-pack.json', 'utf8'))[0];
          const expected = [
            'README.md',
            'docs/cli-reference.md',
            'skills/ux-guard/SKILL.md',
          ];
          for (const path of expected) {
            if (!packed.files.some((file) => file.path === path)) {
              throw new Error(`release tarball is missing ${path}`);
            }
          }
          NODE
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$EXPECTED_INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/ux-guard-0.6.0.sbom.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest release tarball provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tarball }}

      - name: Preserve provenance attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/ux-guard-0.6.0.provenance.sigstore.json"

      - name: Attest release tarball SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tarball }}
          sbom-path: ${{ steps.package.outputs.sbom }}

      - name: Preserve SBOM attestation bundle and checksums
        env:
          BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "dist/ux-guard-0.6.0.sbom.sigstore.json"
          (
            cd dist
            sha256sum \
              edjbarron-ux-guard-0.6.0.tgz \
              npm-pack.json \
              ux-guard-0.6.0.provenance.sigstore.json \
              ux-guard-0.6.0.sbom.cdx.json \
              ux-guard-0.6.0.sbom.sigstore.json \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Select publish or integrity-verified recovery
        id: state
        env:
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"

          TAG_PRESENT=false
          TAG_SHA=""
          set +e
          TAG_LINE="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG^{}" 2>/dev/null)"
          TAG_STATUS=$?
          if test "$TAG_STATUS" -eq 2; then
            TAG_LINE="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" 2>/dev/null)"
            TAG_STATUS=$?
          fi
          set -e
          if test "$TAG_STATUS" -eq 0; then
            TAG_PRESENT=true
            TAG_SHA="${TAG_LINE%%[[:space:]]*}"
          elif test "$TAG_STATUS" -ne 2; then
            echo "::error::unable to determine remote tag state"
            exit 1
          fi

          RELEASE_PRESENT=false
          RELEASE_DRAFT=false
          RELEASE_TARGET=""
          RELEASE_MATCHES="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName \
            --jq '.[] | select(.tagName == "v0.6.0") | .tagName')"
          if test "$RELEASE_MATCHES" = "$RELEASE_TAG"; then
            RELEASE_PRESENT=true
            RELEASE_DRAFT="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)"
            RELEASE_TARGET="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish \
              --jq .targetCommitish)"
          elif test -n "$RELEASE_MATCHES"; then
            echo "::error::ambiguous GitHub release state"
            exit 1
          fi

          set +e
          NPM_VIEW="$(npm view "$EXPECTED_SPEC" dist.integrity 2>&1)"
          NPM_STATUS=$?
          set -e
          if test "$NPM_STATUS" -eq 0; then
            test "$NPM_VIEW" = "$EXPECTED_INTEGRITY" || {
              echo "::error::npm has this version with different integrity"
              exit 1
            }
            if test "$RELEASE_PRESENT" = "true" && test "$RELEASE_DRAFT" != "true"; then
              echo "::error::the immutable GitHub release already exists"
              exit 1
            fi
            if test "$TAG_PRESENT" = "true" && test "$TAG_SHA" != "$GITHUB_SHA"; then
              echo "::error::the existing tag does not identify the requested commit"
              exit 1
            fi
            if test "$RELEASE_PRESENT" = "true" && test "$RELEASE_TARGET" != "$GITHUB_SHA"; then
              echo "::error::the draft release does not target the requested commit"
              exit 1
            fi
            echo "mode=recover" >> "$GITHUB_OUTPUT"
          else
            [[ "$NPM_VIEW" == *"E404"* ]] || {
              echo "::error::npm registry preflight failed without an E404"
              exit 1
            }
            if test "$TAG_PRESENT" = "true" || test "$RELEASE_PRESENT" = "true"; then
              echo "::error::a tag or release exists before npm publication"
              exit 1
            fi
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish exact tarball with the one-time environment token
        id: publish
        if: steps.state.outputs.mode == 'publish'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set +x
          set -euo pipefail
          unset NPM_TOKEN
          test -n "${NODE_AUTH_TOKEN:-}" || {
            echo "::error::the protected npm environment has no NPM_TOKEN secret"
            exit 1
          }
          npm publish "$TARBALL" --provenance --access public

      - name: Confirm npm accepted the exact tarball
        env:
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          ACTUAL_INTEGRITY=""
          for attempt in {1..24}; do
            set +e
            ACTUAL_INTEGRITY="$(npm view "$EXPECTED_SPEC" dist.integrity 2>/dev/null)"
            STATUS=$?
            set -e
            if test "$STATUS" -eq 0 && test -n "$ACTUAL_INTEGRITY"; then
              break
            fi
            sleep 5
          done
          if test "$ACTUAL_INTEGRITY" != "$EXPECTED_INTEGRITY"; then
            echo "::error::npm did not expose the exact release tarball (publish outcome: $PUBLISH_OUTCOME)"
            exit 1
          fi
          if test "${PUBLISH_OUTCOME:-skipped}" = "failure"; then
            echo "::warning::publish reported failure, but npm exposes the exact expected integrity; continuing recovery"
          fi

      - name: Create or recover the GitHub release after npm verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          # ux-guard 0.6.0

          Install from npm:

          `npm install --save-dev @edjbarron/ux-guard@0.6.0`

          Start with:

          `npx ux-guard setup`

          The attached npm tarball is the exact artifact published to npm. Verify
          `SHA256SUMS`, the CycloneDX SBOM, and the GitHub/Sigstore attestations
          before use.
          EOF

          TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if test -z "$TAG_SHA"; then
            TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          RELEASE_MATCHES="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName \
            --jq '.[] | select(.tagName == "v0.6.0") | .tagName')"

          if test "$RELEASE_MATCHES" = "$RELEASE_TAG"; then
            test "$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)" = "true"
            test "$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish \
              --jq .targetCommitish)" = "$GITHUB_SHA"
            if test -n "$TAG_SHA"; then
              test "$TAG_SHA" = "$GITHUB_SHA"
            fi
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/edjbarron-ux-guard-0.6.0.tgz \
              dist/npm-pack.json \
              dist/ux-guard-0.6.0.provenance.sigstore.json \
              dist/ux-guard-0.6.0.sbom.cdx.json \
              dist/ux-guard-0.6.0.sbom.sigstore.json \
              dist/SHA256SUMS
          else
            test -z "$RELEASE_MATCHES"
            if test -n "$TAG_SHA"; then
              test "$TAG_SHA" = "$GITHUB_SHA"
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES" \
              dist/edjbarron-ux-guard-0.6.0.tgz \
              dist/npm-pack.json \
              dist/ux-guard-0.6.0.provenance.sigstore.json \
              dist/ux-guard-0.6.0.sbom.cdx.json \
              dist/ux-guard-0.6.0.sbom.sigstore.json \
              dist/SHA256SUMS
          fi

          set +e
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          EDIT_STATUS=$?
          set -e
          if test "$EDIT_STATUS" -ne 0; then
            gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify the immutable release and every asset
        env:
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in \
            dist/edjbarron-ux-guard-0.6.0.tgz \
            dist/npm-pack.json \
            dist/ux-guard-0.6.0.provenance.sigstore.json \
            dist/ux-guard-0.6.0.sbom.cdx.json \
            dist/ux-guard-0.6.0.sbom.sigstore.json \
            dist/SHA256SUMS
          do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
          test "$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)" = "false"
          TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if test -z "$TAG_SHA"; then
            TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          test "$TAG_SHA" = "$GITHUB_SHA"
          test "$(npm view "$EXPECTED_SPEC" dist.integrity)" = "$EXPECTED_INTEGRITY"
